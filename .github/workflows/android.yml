name: Tracker Lite APK
on:
  push:
    branches: [tracker-lite]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Package licensed pretrained model
        run: |
          set -eu
          mkdir -p app/src/main/assets
          base=https://raw.githubusercontent.com/bytelabs-oss/clash-jev/c1f4893c1627d593938d53910c2568d1addcb8d2
          curl --fail --location --retry 3 "$base/clash_jev/troop_model.onnx" -o app/src/main/assets/troop_model.onnx
          curl --fail --location --retry 3 "$base/LICENSE" -o app/src/main/assets/MODEL-LICENSE.txt
          test "$(wc -c < app/src/main/assets/troop_model.onnx)" -gt 100000
      - name: Build APK
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Clash-Tracker-Lite-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
