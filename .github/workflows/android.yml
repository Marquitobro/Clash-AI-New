name: Tracker Pro APK
on:
  push:
    branches: [tracker-pro]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Export public research detector to ONNX
        env:
          YOLO_CONFIG_DIR: /tmp/yolo
        run: |
          set -eu
          mkdir -p app/src/main/assets /tmp/detector
          base=https://raw.githubusercontent.com/PolarisMurray/Clash_AI/7de479bfc9ad70c8238741b6b6629cd6bf01716c
          curl --fail --location --retry 3 "$base/models/detection/clash_royale_yolo26s.pt" -o /tmp/detector/arena.pt
          curl --fail --location --retry 3 "$base/LICENSE" -o app/src/main/assets/DETECTOR-LICENSE.txt
          test "$(wc -c < /tmp/detector/arena.pt)" -gt 100000
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install 'ultralytics>=8.4,<9' 'onnx>=1.17,<2' 'onnxruntime>=1.20,<2'
          python - <<'PY'
          from ultralytics import YOLO
          import onnxruntime as ort
          import numpy as np
          import shutil
          from pathlib import Path
          model = YOLO('/tmp/detector/arena.pt')
          names = model.names
          labels = [names[i] for i in range(len(names))]
          assert len(labels) == 155, f'Unexpected label count: {len(labels)}'
          p = model.export(format='onnx', imgsz=640, opset=17, simplify=False, dynamic=False, nms=False)
          dest = Path('app/src/main/assets')
          shutil.copyfile(p, dest/'arena.onnx')
          (dest/'arena-labels.txt').write_text('\n'.join(labels)+'\n',encoding='utf-8')
          s = ort.InferenceSession(str(dest/'arena.onnx'),providers=['CPUExecutionProvider'])
          result = s.run(None,{s.get_inputs()[0].name:np.zeros((1,3,640,640),np.float32)})[0]
          print('Model output:',result.shape,'Labels:',len(labels))
          assert result.ndim == 3 and (result.shape[1]==len(labels)+4 or result.shape[2]==6)
          PY
      - name: Build APK
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Clash-Tracker-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
